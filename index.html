  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Segoe UI",
        sans-serif;

      background: #faf8f4;
      color: #403c37;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .characters {
      font-size: 42px;
      margin-bottom: 24px;
      letter-spacing: 8px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 500;
      letter-spacing: -1.5px;
      color: #34312d;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #938b81;
      margin-bottom: 48px;
    }

    .divider {
      width: 42px;
      height: 1px;
      background: #cfc7bd;
      margin: 0 auto 42px;
    }

    .message {
      font-size: 17px;
      line-height: 2;
      color: #625c55;
      word-break: keep-all;
    }

    .message p + p {
      margin-top: 22px;
    }

    .begin {
      margin-top: 52px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-style: italic;
      color: #81786e;
    }

    .date {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa198;
    }

    footer {
      margin-top: 70px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #bbb3aa;
    }

    @media (max-width: 480px) {
      body {
        padding: 40px 24px;
      }

      .characters {
        font-size: 36px;
      }

      .subtitle {
        margin-bottom: 38px;
      }

      .message {
        font-size: 16px;
        line-height: 1.9;
      }

      footer {
        margin-top: 55px;
      }
    }
  </style>

</head>
